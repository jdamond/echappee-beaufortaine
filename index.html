<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>L'Échappée Beaufortaine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Newsreader:ital,opsz,wght@1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen. Poster title top-left, dates under it, ridge line filling the bottom. */
:root{
  --paper:#f6f7f7; --ink:#101214; --mute:#5b6266;
  --m1:#e2e5e6; --m2:#b9bec0; --m3:#70777a; --m4:#101214; --snow:#ffffff; --river:#f6f7f7;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121416; --ink:#eceeee; --mute:#9aa1a4;
  --m1:#3b4144; --m2:#2b2f32; --m3:#1c1f21; --m4:#000000; --snow:#eceeee; --river:#c5cacc; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121416; --ink:#eceeee; --mute:#9aa1a4;
  --m1:#3b4144; --m2:#2b2f32; --m3:#1c1f21; --m4:#000000; --snow:#eceeee; --river:#c5cacc; color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{background:var(--paper);color:var(--ink);display:flex;flex-direction:column;min-height:100%;-webkit-text-size-adjust:100%}
.text{display:flex;flex-direction:column;gap:clamp(8px,2.2vh,24px);padding-block:clamp(16px,5vh,56px) clamp(10px,2.4vh,24px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  width:100%;max-width:1240px;margin:0 auto}
.label{font:500 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font:700 clamp(40px,min(15vw,13vh),190px)/.9 var(--display);text-transform:uppercase;letter-spacing:-.01em;margin:0}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(8px,2.2vh,24px)}
.dates{font:500 clamp(19px,min(5vw,4.2vh),38px) var(--mono);letter-spacing:.04em;font-variant-numeric:tabular-nums;
  border-block:1.5px solid var(--ink);padding-block:.3em;white-space:nowrap}
.tease{font:italic clamp(18px,min(5vw,3.4vh),30px)/1.3 var(--body);margin:0;max-width:30ch;text-wrap:balance}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font:400 clamp(13px,min(3.7vw,2.3vh),16px)/1.35 var(--mono)}
.facts li{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:0 12px;align-items:baseline}
.facts .label{font-size:.82em}
/* The picture always gets enough height to show the summit; it grows to fill what is left. */
.art{flex:1 0 min(40vw,45vh);min-height:160px;width:100%;display:block}
/* Wide screens: title on one line, dates and phrase side by side, so the picture keeps its height. */
@media (min-aspect-ratio:5/4){
  h1{font-size:clamp(34px,min(7.3vw,18vh),150px)}
  h1 br{display:none}
  .row{flex-direction:row;align-items:center;gap:8px clamp(18px,3vw,44px);flex-wrap:wrap}
  .tease{max-width:none}
  .text{padding-top:clamp(12px,3vh,40px);gap:clamp(6px,1.7vh,20px)}
  .facts{flex-direction:row;flex-wrap:wrap;gap:6px clamp(20px,3.4vw,56px)}
  .facts li{display:flex;flex-direction:column;gap:2px}
  .art{flex-basis:min(40vw,62vh)}
}
/* Very wide, short screens (a phone on its side): the picture fills the screen and the text sits in the sky. */
@media (min-aspect-ratio:2/1){
  body{position:relative}
  .text{position:absolute;top:0;left:0;width:auto;max-width:none;margin:0;gap:clamp(6px,2vh,18px);padding-top:clamp(12px,4vh,40px)}
  h1{font-size:clamp(30px,min(4.8vw,14vh),130px)}
  .row{flex-direction:column;align-items:flex-start;gap:clamp(6px,2vh,18px)}
  .dates{font-size:clamp(16px,min(2.4vw,5.5vh),34px)}
  .tease{max-width:24ch;font-size:clamp(15px,min(2vw,5vh),26px)}
  .facts{flex-direction:column;gap:3px;max-width:34vw;font-size:clamp(11px,min(1.5vw,3.6vh),15px)}
  .facts li{display:grid;grid-template-columns:5.2em minmax(0,1fr)}
  .art{flex:1 0 0}
}
</style>

<div class="text">
  <span class="label">Save the date</span>
  <h1>L'Échappée <br>Beaufortaine</h1>
  <div class="row">
    <span class="dates">5–8 August 2027</span>
    <p class="tease">Hou je agenda vrij en je benen fris. De rest volgt.</p>
  </div>
  <ul class="facts">
    <li><span class="label">Where</span><span>Beaufort, Savoie</span></li>
    <li><span class="label">Format</span><span>4-day stage run</span></li>
    <li><span class="label">Routes</span><span>Long line or short line. You choose each day.</span></li>
  </ul>
</div>
<svg class="art" id="art" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Gelaagde bergkammen met besneeuwde toppen, dennenbos en een bergbeek"></svg>

<script>
(function(){
  let s=7; const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  const ridge=(base,amp,k,jit)=>{let d="M0 520";for(let x=0;x<=1200;x+=20){const y=base-amp*(.5*Math.sin(x*.004+k)+.3*Math.sin(x*.011+2*k)+.2*Math.sin(x*.027+3*k))-jit*rnd();d+=` L${x} ${y.toFixed(1)}`}return d+" L1200 520Z"};
  const mb=[[0,335],[80,305],[150,322],[230,268],[300,290],[380,222],[430,240],[500,165],[548,132],[610,96],[668,118],[720,104],[770,150],[830,138],[880,196],[950,178],[1010,236],[1080,224],[1140,270],[1200,258]];
  const mbD="M0 520 "+mb.map(p=>`L${p[0]} ${p[1]}`).join(" ")+" L1200 520Z";
  let snow="M200 0 L1100 0 L1100 210";for(let x=1070,i=0;x>=200;x-=30,i++)snow+=` L${x} ${(i%2?222:190)+rnd()*16|0}`;snow+="Z";
  const yF=x=>408-26*Math.sin(x/170+1)+26*Math.exp(-(((x-660)/95)**2));
  let fg="M0 520";for(let x=0;x<=1200;x+=15)fg+=` L${x} ${yF(x).toFixed(1)}`;fg+=" L1200 520Z";
  let trees="";for(let x=6;x<1200;x+=10+rnd()*20){if(x>596&&x<728)continue;const h=18+rnd()*34,w=h*.24,y=yF(x)+5;
    trees+=`M${x} ${y-h} L${x-w*.55} ${y-h*.62} L${x-w*.25} ${y-h*.62} L${x-w*.8} ${y-h*.3} L${x-w*.35} ${y-h*.3} L${x-w} ${y} L${x+w} ${y} L${x+w*.35} ${y-h*.3} L${x+w*.8} ${y-h*.3} L${x+w*.25} ${y-h*.62} L${x+w*.55} ${y-h*.62}Z `}
  const river="M655 430 C632 448 700 458 664 478 C628 496 566 500 540 520 L650 520 C660 504 704 496 716 474 C728 452 664 446 664 430Z";
  document.getElementById("art").innerHTML=
   `<defs><clipPath id="mbc"><path d="${mbD}"/></clipPath></defs>
    <path d="${mbD}" fill="var(--m1)" stroke="var(--m3)" stroke-width="1"/>
    <path d="${snow}" fill="var(--snow)" clip-path="url(#mbc)"/>
    <path d="${ridge(330,60,1.3,14)}" fill="var(--m2)"/>
    <path d="${ridge(385,46,4.1,10)}" fill="var(--m3)"/>
    <path d="${fg}" fill="var(--m4)"/><path d="${trees}" fill="var(--m4)"/>
    <path d="${river}" fill="var(--river)"/>`;
})();
</script>

</html>
